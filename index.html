<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For Petra 💕</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>For Petra 💕</h1>

      <p class="compliment" id="compliment">You're amazing ✨</p>

      <p class="subtitle">Together for</p>
      <div class="timer">
        <div class="time-block">
          <span class="time-value" id="days">0</span>
          <span class="time-label">days</span>
        </div>
        <div class="time-block">
          <span class="time-value" id="hours">0</span>
          <span class="time-label">hours</span>
        </div>
        <div class="time-block">
          <span class="time-value" id="minutes">0</span>
          <span class="time-label">minutes</span>
        </div>
        <div class="time-block">
          <span class="time-value" id="seconds">0</span>
          <span class="time-label">seconds</span>
        </div>
      </div>

      <div class="photo">
        <img src="photos/photo1.jpg" alt="Us" />
      </div>

      <div id="toast" class="toast"></div>
      <button id="thinking-btn">Thinking of you 💭</button>

      <p class="message">[тут будет милый текст от тебя]</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
